<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Thư viện prompt nâng cao, tìm kiếm theo nội dung và sao chép nhanh.">
  <title>Prompt nâng cao — Skill AI</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    (() => { if (new URLSearchParams(location.search).get('embed') === '1') document.documentElement.dataset.embedded = 'true'; try { if (localStorage.getItem('skill-ai-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (error) { /* private browsing */ } })();
  </script>
  <script defer src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script defer src="dashboard-config.js"></script>
  <script defer src="advanced-prompts.js"></script>
  <style>
    :root { color-scheme: light; --ink:#17231f; --muted:#65716c; --line:#e2e2e2; --ground:#f8f8f8; --paper:#fff; --soft:#eee; --accent:#141414; --accent-strong:#0a0a0a; --danger:#a43f3f; --focus:rgba(20,20,20,.2); --type-display:clamp(28px,3vw,38px); --type-heading:24px; --type-subheading:17px; --type-body:14px; --type-secondary:13px; --type-label:12px; }
    html[data-theme="dark"] { color-scheme:dark; --ink:#f8f8f2; --muted:#c7c9d3; --line:#44475a; --ground:#282a36; --paper:#343746; --soft:#44475a; --accent:#bd93f9; --accent-strong:#ff79c6; --danger:#ff5555; --focus:rgba(189,147,249,.38); }
    * { box-sizing:border-box; }
    html { min-height:100%; overflow-y:scroll; scrollbar-gutter:stable; background:var(--ground); }
    body { min-height:100svh; margin:0; color:var(--ink); background:var(--ground); font:14px/1.55 "Geist","Segoe UI",sans-serif; }
    button,input,select { font:inherit; } button { cursor:pointer; }
    button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
    .site-header { position:fixed; z-index:5; inset:0 auto 0 0; display:flex; flex-direction:column; align-items:stretch; gap:24px; width:236px; min-height:100svh; padding:28px 18px; border-right:1px solid var(--line); /* taste-skill-ignore: app navigation boundary */ background:var(--ground); }
    .brand { display:inline-flex; align-items:center; gap:12px; color:var(--ink); text-decoration:none; }
    .brand-mark { display:grid; place-items:center; width:32px; height:32px; border:1px solid var(--ink); font-size:11px; font-weight:700; letter-spacing:-.05em; }
    .brand-name,.brand-subtitle { display:block; }.brand-name { font-size:15px; font-weight:700; letter-spacing:-.02em; }.brand-subtitle { color:var(--muted); font-size:11px; }
    .sidebar-nav { display:grid; gap:4px; margin-top:16px; }
    .sidebar-nav a { padding:9px 10px; border-radius:6px; color:var(--muted); font-size:13px; text-decoration:none; }
    .sidebar-nav a:hover,.sidebar-nav a.active { background:var(--soft); color:var(--ink); }
    .header-status { display:grid; gap:10px; margin-top:auto; color:var(--muted); font-size:12px; }
    .header-actions { display:grid; grid-template-columns:62px 1fr; gap:8px; }
    .quiet-button { padding:8px 12px; border:1px solid var(--line); border-radius:6px; background:var(--paper); color:var(--ink); }
    .quiet-button:hover { border-color:var(--accent); color:var(--accent-strong); }
    .theme-toggle { display:inline-flex; align-items:center; justify-content:center; width:62px; min-width:62px; padding:4px; }
    .theme-switch-track { position:relative; display:block; flex:0 0 50px; width:50px; height:28px; overflow:hidden; border:1px solid var(--line); border-radius:999px; background:var(--soft); color:var(--muted); }
    .theme-switch-icon { position:absolute; z-index:1; top:6px; display:grid; place-items:center; width:16px; height:16px; }.theme-switch-static-moon { left:5px; }.theme-switch-static-sun { right:5px; }
    .theme-icon { width:14px; height:14px; fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.7; }
    .theme-switch-thumb { position:absolute; z-index:2; top:2px; left:2px; display:grid; place-items:center; width:22px; height:22px; border:1px solid var(--line); border-radius:50%; background:var(--paper); transition:transform .2s ease; }
    .theme-toggle.is-dark .theme-switch-thumb { transform:translateX(24px); }.theme-thumb-icon { width:14px; height:14px; fill:none; stroke:var(--accent-strong); stroke-linecap:round; stroke-linejoin:round; stroke-width:1.7; }
    .theme-toggle.is-dark .theme-switch-static-moon,.theme-toggle:not(.is-dark) .theme-switch-static-sun { color:var(--muted); }
    .page-shell { width:calc(100% - 236px); margin-left:236px; padding:44px clamp(28px,4vw,64px) 64px; }
    .page-heading { display:grid; grid-template-columns:minmax(0,1fr) minmax(230px,320px); align-items:end; gap:36px; padding-bottom:26px; border-bottom:1px solid var(--line); /* taste-skill-ignore: separates page intro from search controls */ }
    h1 { margin:0; font-size:var(--type-display); line-height:1.08; letter-spacing:-.045em; }
    h2 { font-size:var(--type-heading); line-height:1.15; letter-spacing:-.04em; }
    h3 { font-size:var(--type-subheading); line-height:1.35; letter-spacing:-.02em; }
    p { font-size:var(--type-body); line-height:1.55; }
    .intro-copy { max-width:650px; margin:12px 0 0; color:var(--muted); }
    .count-note { padding-left:15px; border-left:2px solid var(--accent); color:var(--muted); font-size:var(--type-secondary); }.count-note strong { display:block; color:var(--ink); font-size:15px; }
    .prompt-controls { display:grid; grid-template-columns:minmax(250px,1fr) 230px; gap:12px; padding:22px 0 18px; }
    .control label { display:block; margin-bottom:6px; color:var(--muted); font-size:var(--type-label); font-weight:600; }
    .control input,.control select { width:100%; min-height:44px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:var(--paper); color:var(--ink); }
    .results-line { display:flex; justify-content:space-between; gap:16px; padding:12px 0; border-top:1px solid var(--line); /* taste-skill-ignore: separates controls from live result count */ color:var(--muted); font-size:var(--type-secondary); }
    .prompt-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; padding-top:12px; }
    .prompt-item { min-width:0; padding:18px; border:1px solid var(--line); /* taste-skill-ignore: prompt is a distinct copyable content unit */ background:var(--paper); }
    .prompt-item header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .prompt-item h3 { margin:0; }
    .prompt-categories { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; color:var(--muted); font-size:12px; }
    .prompt-categories span { padding:3px 7px; border-radius:4px; background:var(--soft); }
    .prompt-text { margin:14px 0 0; padding-top:13px; border-top:1px solid var(--line); /* taste-skill-ignore: separates title metadata from the verbatim prompt */ color:var(--ink); font-size:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .copy-prompt { flex:0 0 auto; min-width:78px; }
    .prompt-skeleton { min-height:210px; background:var(--soft); opacity:.5; animation:skeleton-pulse 1.15s ease-in-out infinite; }
    @keyframes skeleton-pulse { 0%,100% { opacity:.45; } 50% { opacity:1; } }
    .empty-state,.error-state { grid-column:1/-1; padding:32px 0; color:var(--muted); }
    .error-state { color:var(--danger); }
    .toast { position:fixed; right:18px; bottom:18px; max-width:calc(100% - 36px); padding:11px 14px; border:1px solid var(--line); background:var(--paper); color:var(--ink); opacity:0; pointer-events:none; transform:translateY(8px); transition:opacity .16s ease,transform .16s ease; }
    .toast.is-visible { opacity:1; transform:translateY(0); }
    @media (max-width:900px) {
      .site-header { position:static; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:10px 12px; width:auto; min-height:0; padding:12px 16px; border-right:0; border-bottom:1px solid var(--line); /* taste-skill-ignore: separates compact navigation from page content */ }
      .sidebar-nav { display:flex; grid-column:1/-1; grid-row:2; gap:6px; margin:0; overflow-x:auto; scrollbar-width:none; }.sidebar-nav::-webkit-scrollbar { display:none; }.sidebar-nav a { flex:0 0 auto; padding:8px 10px; }
      .header-status { display:grid; grid-column:2; grid-row:1; gap:5px; margin:0; text-align:right; font-size:11px; }.header-actions { grid-template-columns:54px auto; gap:6px; }.header-actions .theme-toggle { width:54px; min-width:54px; }.header-actions button:last-child { padding:8px 10px; }
      .page-shell { width:100%; margin:0; padding:24px 16px 42px; }.page-heading { grid-template-columns:1fr; gap:14px; }.count-note { max-width:360px; }
      .prompt-list { grid-template-columns:1fr; gap:12px; }.prompt-controls { grid-template-columns:minmax(0,1fr) 190px; }
    }
    @media (max-width:520px) {
      .site-header { padding:11px 14px; }.brand { gap:9px; }.brand-mark { width:30px; height:30px; }.brand-name { font-size:14px; }.brand-subtitle,.header-status { font-size:10px; }
      .header-actions { grid-template-columns:48px auto; }.header-actions .theme-toggle { width:48px; min-width:48px; }.header-actions button:last-child { padding:8px 9px; }
      .page-shell { padding:20px 14px 36px; }.page-heading { padding-bottom:18px; } h1 { font-size:28px; }
      .prompt-controls { grid-template-columns:1fr; gap:10px; padding:16px 0 12px; }.prompt-item { padding:15px; }.prompt-text { font-size:var(--type-body); }
      .results-line { font-size:var(--type-secondary); }
    }
    html[data-embedded="true"] .site-header { display:none; }
    html[data-embedded="true"] .page-shell { width:100%; margin:0; padding:40px clamp(28px,4vw,64px) 64px; }
    @media (max-width:900px) { html[data-embedded="true"] .page-shell { padding:24px 16px 42px; } }
    @media (max-width:520px) { html[data-embedded="true"] .page-shell { padding:20px 14px 36px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Skill AI"><span class="brand-mark" aria-hidden="true">SA</span><span><span class="brand-name">Skill AI</span><span class="brand-subtitle">Thư viện tra cứu</span></span></a>
    <nav class="sidebar-nav" aria-label="Điều hướng thư viện"><a href="index.html">Kho Skill</a><a class="active" href="prompts.html" aria-current="page">Prompt nâng cao</a></nav>
    <div class="header-status"><span id="datasetStatus" aria-live="polite">Đang tải prompt…</span><div class="header-actions">
      <button class="quiet-button theme-toggle" id="themeToggle" type="button" aria-pressed="false" aria-label="Chuyển sang giao diện tối"><span class="theme-switch-track" aria-hidden="true">
        <span class="theme-switch-icon theme-switch-static-moon"><svg class="theme-icon" viewBox="0 0 24 24"><path d="M20.5 15.2A8.7 8.7 0 0 1 8.8 3.5 8.7 8.7 0 1 0 20.5 15.2Z"></path></svg></span>
        <span class="theme-switch-icon theme-switch-static-sun"><svg class="theme-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>
        <span class="theme-switch-thumb"><svg class="theme-thumb-icon" id="themeThumbMoon" viewBox="0 0 24 24"><path d="M20.5 15.2A8.7 8.7 0 0 1 8.8 3.5 8.7 8.7 0 1 0 20.5 15.2Z"></path></svg><svg class="theme-thumb-icon" id="themeThumbSun" viewBox="0 0 24 24" hidden><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l-1.4 1.4M17.7 6.3l1.4-1.4"></path></svg></span>
      </span></button><button class="quiet-button" id="refreshButton" type="button">Làm mới</button>
    </div></div>
  </header>
  <main class="page-shell">
    <section class="page-heading" aria-labelledby="pageTitle"><div><h1 id="pageTitle">Prompt nâng cao</h1><p class="intro-copy">Tìm mẫu phù hợp, thay phần trong ngoặc vuông bằng thông tin của bạn rồi sao chép để dùng.</p></div><div class="count-note"><strong id="promptCount">— prompt</strong><span>Đọc từ sheet “Prompt nâng cao” trong workbook Skill AI.</span></div></section>
    <section class="prompt-controls" aria-label="Tìm kiếm prompt">
      <div class="control"><label for="promptSearch">Tìm trong tiêu đề và nội dung</label><input id="promptSearch" type="search" placeholder="Ví dụ: website, UX, SEO, học tiếng Anh…" autocomplete="off"></div>
      <div class="control"><label for="categoryFilter">Nhóm chủ đề</label><select id="categoryFilter"><option value="">Tất cả nhóm</option></select></div>
    </section>
    <div class="results-line"><span id="resultCount" aria-live="polite">Đang đọc workbook…</span><button class="quiet-button" id="clearSearch" type="button">Xóa tìm kiếm</button></div>
    <section class="prompt-list" id="promptList" aria-label="Danh sách prompt"><div class="prompt-skeleton" aria-hidden="true"></div><div class="prompt-skeleton" aria-hidden="true"></div><div class="prompt-skeleton" aria-hidden="true"></div><div class="prompt-skeleton" aria-hidden="true"></div></section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
